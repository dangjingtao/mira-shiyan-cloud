name: Shiyan Cloud Dev Deploy

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.api.jsonc'
      - 'wrangler.llm.jsonc'
      - '.github/workflows/deploy-dev.yml'

permissions:
  contents: read

concurrency:
  group: shiyan-cloud-dev-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.79.0'

jobs:
  preflight:
    name: Preflight Shiyan credentials and Cloudflare resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHIYAN_D1_DATABASE_ID: ${{ vars.SHIYAN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare query credentials
        shell: bash
        run: |
          set -uo pipefail
          missing=0

          require_value() {
            local kind="$1"
            local name="$2"
            local value="$3"
            if [ -z "$value" ]; then
              echo "::error::Missing ${kind}: ${name}"
              missing=1
            else
              echo "Found ${kind}: ${name}"
            fi
          }

          require_value 'GitHub secret' 'CLOUDFLARE_API_TOKEN' "${CLOUDFLARE_API_TOKEN:-}"
          require_value 'GitHub secret' 'CLOUDFLARE_ACCOUNT_ID' "${CLOUDFLARE_ACCOUNT_ID:-}"
          exit "$missing"

      - name: Build minimal API config for secret inspection
        shell: bash
        run: |
          cat > wrangler.api.preflight.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "mira-shiyan-api",
            "main": "src/api/index.ts",
            "compatibility_date": "2026-08-29"
          }
          EOF

      - name: Verify Cloudflare runtime secrets
        shell: bash
        run: |
          set -uo pipefail
          missing=0

          check_worker_secrets() {
            local config="$1"
            shift
            local output

            if ! output="$(npx --yes wrangler@${WRANGLER_VERSION} secret list -c "$config" 2>&1)"; then
              if grep -q 'Worker .* not found' <<<"$output"; then
                echo "::warning::Worker for $config does not exist yet; secret inspection will run after bootstrap deploy."
                return 0
              fi
              echo "::error::Unable to query Cloudflare secrets for $config"
              echo "$output"
              missing=1
              return
            fi

            for name in "$@"; do
              if grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output"; then
                echo "Found Cloudflare runtime secret: $name"
              else
                echo "::error::Missing Cloudflare runtime secret: $name"
                missing=1
              fi
            done
          }

          check_worker_secrets wrangler.llm.jsonc \
            LLM_PRIMARY_API_KEY \
            LLM_FALLBACK_API_KEY

          check_worker_secrets wrangler.api.preflight.jsonc \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            DEVICE_AUTH_PEPPER \
            GITHUB_DESTINATION_TOKEN

          exit "$missing"

      - name: Validate D1 deployment input
        shell: bash
        run: |
          if [ -z "${SHIYAN_D1_DATABASE_ID:-}" ]; then
            echo '::error::Missing GitHub repository/environment variable: SHIYAN_D1_DATABASE_ID'
            exit 1
          fi
          echo 'Found GitHub repository/environment variable: SHIYAN_D1_DATABASE_ID'

      - name: Build effective API Wrangler config for D1 inspection
        if: ${{ vars.SHIYAN_D1_DATABASE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.api.jsonc wrangler.api.d1-preflight.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.api.d1-preflight.jsonc';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('REPLACE_WITH_D1_DATABASE_ID')) {
            throw new Error('wrangler.api.jsonc no longer contains the expected D1 placeholder; update workflow intentionally');
          }
          text = text.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.SHIYAN_D1_DATABASE_ID);
          fs.writeFileSync(path, text);
          NODE

      - name: Verify Cloudflare D1 database is reachable
        if: ${{ vars.SHIYAN_D1_DATABASE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 info mira-shiyan -c wrangler.api.d1-preflight.jsonc >/dev/null
          echo 'Cloudflare D1 reachable: mira-shiyan'

  validate:
    name: Validate Shiyan cloud contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Cloudflare runtime and binding types
        run: npx wrangler types worker-configuration.d.ts -c wrangler.api.jsonc

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Run Shiyan workflow and destination tests
        run: >-
          npx tsx --test
          tests/stt.test.ts
          tests/mob019.workflow.test.ts
          tests/mob020.llm.test.ts
          tests/mob020.organize.test.ts
          tests/mob022.destination.test.ts
          tests/mob022.delivery.test.ts

      - name: Dry-run public API Worker
        run: npx wrangler deploy --dry-run -c wrangler.api.jsonc

      - name: Dry-run private LLM Worker
        run: npx wrangler deploy --dry-run -c wrangler.llm.jsonc

      - name: Verify D1 migrations locally
        run: |
          set -euo pipefail
          sqlite3 /tmp/shiyan.db < migrations/0001_capture_foundation.sql
          sqlite3 /tmp/shiyan.db < migrations/0001_capture_foundation.sql
          sqlite3 /tmp/shiyan.db < migrations/0002_stt_transcript.sql
          sqlite3 /tmp/shiyan.db < migrations/0004_delivery_records.sql
          sqlite3 /tmp/shiyan.db < migrations/0005_llm_organization.sql
          sqlite3 /tmp/shiyan.db < migrations/0005_llm_organization.sql
          sqlite3 /tmp/shiyan.db '.schema transcripts'
          sqlite3 /tmp/shiyan.db '.schema transcript_segments'
          sqlite3 /tmp/shiyan.db '.schema delivery_records'
          sqlite3 /tmp/shiyan.db '.schema drafts'
          sqlite3 /tmp/shiyan.db '.schema scenes'
          sqlite3 /tmp/shiyan.db 'PRAGMA table_info(audio_assets);'

  deploy:
    name: Deploy dev to Cloudflare
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHIYAN_D1_DATABASE_ID: ${{ vars.SHIYAN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build effective API Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.api.jsonc wrangler.api.deploy.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.api.deploy.jsonc';
          let text = fs.readFileSync(path, 'utf8');

          if (!text.includes('REPLACE_WITH_D1_DATABASE_ID')) {
            throw new Error('wrangler.api.jsonc no longer contains the expected D1 placeholder; update deploy workflow intentionally');
          }

          text = text.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.SHIYAN_D1_DATABASE_ID);

          if (!text.includes('"R2_ACCOUNT_ID"')) {
            text = text.replace(
              '"R2_BUCKET_NAME": "mira-shiyan-audio",',
              `"R2_BUCKET_NAME": "mira-shiyan-audio",\n    "R2_ACCOUNT_ID": "${process.env.CLOUDFLARE_ACCOUNT_ID}",`,
            );
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Deploy private LLM Worker first
        run: npx wrangler deploy -c wrangler.llm.jsonc

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply mira-shiyan --remote -c wrangler.api.deploy.jsonc

      - name: Deploy public API Worker and Workflow
        run: npx wrangler deploy -c wrangler.api.deploy.jsonc

      - name: Verify required Cloudflare runtime secrets after deploy
        shell: bash
        run: |
          set -uo pipefail
          missing=0

          require_worker_secrets() {
            local config="$1"
            shift
            local output
            output="$(npx wrangler secret list -c "$config")" || return 1

            for name in "$@"; do
              if grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output"; then
                echo "Found Cloudflare runtime secret: $name"
              else
                echo "::error::Missing Cloudflare runtime secret: $name"
                missing=1
              fi
            done
          }

          require_worker_secrets wrangler.llm.jsonc \
            LLM_PRIMARY_API_KEY \
            LLM_FALLBACK_API_KEY

          require_worker_secrets wrangler.api.deploy.jsonc \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            DEVICE_AUTH_PEPPER \
            GITHUB_DESTINATION_TOKEN

          exit "$missing"

      - name: Show deployed versions
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list -c wrangler.llm.jsonc
          npx wrangler deployments list -c wrangler.api.deploy.jsonc
