name: Inspect Shiyan aggregate state

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/inspect-shiyan-aggregate.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHIYAN_D1_DATABASE_ID: ${{ vars.SHIYAN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build effective D1 config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.api.jsonc wrangler.inspect.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'wrangler.inspect.jsonc';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.SHIYAN_D1_DATABASE_ID);
          fs.writeFileSync(p, s);
          NODE
      - name: Aggregate capture state only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT 'capture_tasks' AS entity, COUNT(*) AS count, MAX(updated_at) AS latest_update FROM capture_tasks UNION ALL SELECT 'capture_stages', COUNT(*), MAX(updated_at) FROM capture_stages UNION ALL SELECT 'transcripts', COUNT(*), MAX(created_at) FROM transcripts UNION ALL SELECT 'drafts', COUNT(*), MAX(updated_at) FROM drafts;"
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT stage, status, COUNT(*) AS count, MAX(updated_at) AS latest_update FROM capture_stages GROUP BY stage, status ORDER BY stage, status;"
