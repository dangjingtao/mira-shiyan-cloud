name: Inspect latest Shiyan capture state

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/inspect-latest-capture.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHIYAN_D1_DATABASE_ID: ${{ vars.SHIYAN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build effective D1 config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.api.jsonc wrangler.inspect.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'wrangler.inspect.jsonc';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.SHIYAN_D1_DATABASE_ID);
          fs.writeFileSync(p, s);
          NODE
      - name: Latest capture tasks
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT id, device_id, title, scene_id, lifecycle_status, current_stage, created_at, updated_at FROM capture_tasks ORDER BY created_at DESC LIMIT 5;"
      - name: Latest audio assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT id, task_id, status, expected_size_bytes, actual_size_bytes, created_at, confirmed_at FROM audio_assets ORDER BY created_at DESC LIMIT 5;"
