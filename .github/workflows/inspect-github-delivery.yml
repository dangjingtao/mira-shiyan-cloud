name: Inspect Shiyan GitHub delivery failure

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/inspect-github-delivery.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHIYAN_D1_DATABASE_ID: ${{ vars.SHIYAN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build effective D1 config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.api.jsonc wrangler.inspect.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'wrangler.inspect.jsonc';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.SHIYAN_D1_DATABASE_ID);
          fs.writeFileSync(p, s);
          NODE
      - name: Inspect recent delivery evidence without content
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT destination, status, retryable, retry_count, repository, path, error_code, error_message, created_at, updated_at, delivered_at FROM delivery_records ORDER BY created_at DESC LIMIT 6;"
          npx --yes wrangler@4.79.0 d1 execute mira-shiyan --remote -c wrangler.inspect.jsonc --command "SELECT stage, status, retryable, retry_count, error_code, error_message, started_at, finished_at, updated_at FROM capture_stages WHERE stage='delivery' ORDER BY updated_at DESC LIMIT 6;"
      - name: Inspect non-secret GitHub destination variables
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/mira-shiyan-api/settings" \
            | jq '{success, vars: [(.result.bindings // [])[] | select(.type == "plain_text") | select(.name == "GITHUB_DESTINATION_OWNER" or .name == "GITHUB_DESTINATION_REPOSITORY" or .name == "GITHUB_DESTINATION_BRANCH" or .name == "GITHUB_DESTINATION_ROOT") | {name, text}]}'
