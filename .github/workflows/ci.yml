name: Shiyan Cloud CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate Cloudflare runtime and binding types
        run: npx --yes wrangler@4.79.0 types worker-configuration.d.ts -c wrangler.api.jsonc
      - name: Typecheck
        run: npx --yes -p typescript@5.9.2 tsc -p tsconfig.json
      - name: Shiyan workflow and destination tests
        run: npx --yes tsx@4.20.5 --test tests/stt.test.ts tests/mob019.workflow.test.ts tests/mob020.llm.test.ts tests/mob020.organize.test.ts tests/mob022.destination.test.ts tests/mob022.delivery.test.ts
      - name: Dry-run public API Worker
        run: npx --yes wrangler@4.79.0 deploy --dry-run -c wrangler.api.jsonc
      - name: Dry-run private LLM Worker
        run: npx --yes wrangler@4.79.0 deploy --dry-run -c wrangler.llm.jsonc
      - name: Verify D1 migrations
        run: |
          sqlite3 /tmp/shiyan.db < migrations/0001_capture_foundation.sql
          sqlite3 /tmp/shiyan.db < migrations/0001_capture_foundation.sql
          sqlite3 /tmp/shiyan.db < migrations/0002_stt_transcript.sql
          sqlite3 /tmp/shiyan.db < migrations/0004_delivery_records.sql
          sqlite3 /tmp/shiyan.db < migrations/0005_llm_organization.sql
          sqlite3 /tmp/shiyan.db < migrations/0005_llm_organization.sql
          sqlite3 /tmp/shiyan.db < migrations/0006_final_draft_lifecycle_backfill.sql
          sqlite3 /tmp/shiyan.db < migrations/0006_final_draft_lifecycle_backfill.sql
          sqlite3 /tmp/shiyan.db '.schema transcripts'
          sqlite3 /tmp/shiyan.db '.schema transcript_segments'
          sqlite3 /tmp/shiyan.db '.schema delivery_records'
          sqlite3 /tmp/shiyan.db '.schema drafts'
          sqlite3 /tmp/shiyan.db '.schema scenes'
          sqlite3 /tmp/shiyan.db 'PRAGMA table_info(audio_assets);'
