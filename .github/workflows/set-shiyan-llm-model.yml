name: Set Shiyan LLM model

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/set-shiyan-llm-model.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: shiyan-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy LLM Worker with valid Coding Plan model name
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.79.0 deploy -c wrangler.llm.jsonc \
            --var 'LLM_PRIMARY_PROVIDER:volcengine-ark-coding-plan' \
            --var 'LLM_PRIMARY_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3' \
            --var 'LLM_PRIMARY_MODEL:doubao-seed-2.0-lite' \
            --var 'LLM_TIMEOUT_MS:120000' \
            --var 'LLM_MAX_TRANSCRIPT_CHARS:200000'
      - name: Verify non-secret runtime model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/mira-shiyan-llm/settings" \
            | jq -e '.result.bindings[] | select(.type == "plain_text" and .name == "LLM_PRIMARY_MODEL" and .text == "doubao-seed-2.0-lite")' >/dev/null
          echo 'Verified LLM_PRIMARY_MODEL=doubao-seed-2.0-lite'
