name: Repair MOB-020 Test Harness

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-mob020-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Finish test harness repair and CI trigger coverage
        shell: python
        run: |
          from pathlib import Path

          test_path = Path('tests/mob020.organize.test.ts')
          text = test_path.read_text()
          old = """  assert.equal(
            db.statements.some(({ sql }) => sql.includes('FROM transcripts')),
            true,
          );"""
          new = """  // A successful retry already proves a persisted Transcript was available;
          // separately assert that retry preserves that evidence and never restarts STT.
          assert.equal(db.transcript?.text, TRANSCRIPT_TEXT);"""
          if old not in text:
              raise SystemExit('Expected stale Transcript-read assertion not found')
          test_path.write_text(text.replace(old, new, 1))

          workflow_path = Path('.github/workflows/deploy-dev.yml')
          workflow = workflow_path.read_text()
          marker = "      - 'migrations/**'\n"
          addition = "      - 'migrations/**'\n      - 'tests/**'\n"
          if "      - 'tests/**'\n" not in workflow:
              if marker not in workflow:
                  raise SystemExit('Deploy workflow path marker not found')
              workflow = workflow.replace(marker, addition, 1)
              workflow_path.write_text(workflow)

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code && { echo 'No repair needed'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mob020.organize.test.ts .github/workflows/deploy-dev.yml
          git commit -m 'test: finish MOB-020 harness alignment'
          git push origin HEAD:dev
