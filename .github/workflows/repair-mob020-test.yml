name: Repair MOB-020 Test Harness

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-mob020-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Finish stale retry assertion repair
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tests/mob020.organize.test.ts')
          text = path.read_text()
          pattern = re.compile(
              r"assert\.equal\(\s*db\.statements\.some\(\(\{ sql \}\) => sql\.includes\('FROM transcripts'\)\),\s*true,\s*\);",
              re.MULTILINE,
          )
          replacement = """// A successful retry already proves a persisted Transcript was available;
          // separately assert that retry preserves that evidence and never restarts STT.
          assert.equal(db.transcript?.text, TRANSCRIPT_TEXT);"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one stale Transcript-read assertion; got {count}')
          path.write_text(text)

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mob020.organize.test.ts
          git commit -m 'test: finish MOB-020 harness alignment'
          git push origin HEAD:dev
