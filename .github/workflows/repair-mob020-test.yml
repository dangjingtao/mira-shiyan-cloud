name: Repair MOB-020 Test Harness

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-mob020-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Repair stale FakeDb SQL mappings
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tests/mob020.organize.test.ts')
          text = path.read_text()

          field_replacements = {
              'title': 'title: null,',
              'markdown': 'markdown: values[7] as string,',
              'structured_json': 'structured_json: values[8] as string,',
              'scene_id': 'scene_id: values[9] as string,',
              'provider': 'provider: values[10] as string,',
              'model': 'model: values[11] as string,',
              'latency_ms': 'latency_ms: values[12] as number,',
              'prompt_tokens': 'prompt_tokens: (values[13] as number | null) ?? null,',
              'completion_tokens': 'completion_tokens: (values[14] as number | null) ?? null,',
              'total_tokens': 'total_tokens: (values[15] as number | null) ?? null,',
              'provider_request_id': 'provider_request_id: (values[16] as string | null) ?? null,',
              'fallback_used': 'fallback_used: values[17] as number,',
              'correlation_id': 'correlation_id: values[18] as string,',
              'confirmed_at': 'confirmed_at: null,',
              'created_at': 'created_at: values[19] as string,',
              'updated_at': 'updated_at: values[20] as string,',
          }

          # Scope field rewrites to the AI Draft object only, so the Final Draft
          # harness (which has a different bind contract) remains untouched.
          start = text.index('      const draft: DraftRow = {')
          end = text.index('      };', start) + len('      };')
          block = text[start:end]
          for field, replacement in field_replacements.items():
              pattern = rf'(?m)^(\s*){re.escape(field)}:.*$'
              block, count = re.subn(
                  pattern,
                  lambda match, r=replacement: f'{match.group(1)}{r}',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Expected one AI Draft field: {field}; got {count}')
          text = text[:start] + block + text[end:]

          insert_old = "      const stage = values[1] as string;"
          insert_new = "      const hardcodedStage = /VALUES\\s*\\(\\?,\\s*'([^']+)'/u.exec(sql)?.[1];\n      const stage = hardcodedStage ?? (values[1] as string);"
          if insert_old not in text:
              raise SystemExit('Expected capture stage INSERT mapping not found')
          text = text.replace(insert_old, insert_new, 1)

          update_old = "      const stage = values.at(-1) as string;"
          update_new = "      const hardcodedStage = /stage\\s*=\\s*'([^']+)'/u.exec(sql)?.[1];\n      const stage = hardcodedStage ?? (values.at(-1) as string);"
          if update_old not in text:
              raise SystemExit('Expected capture stage UPDATE mapping not found')
          text = text.replace(update_old, update_new, 1)

          path.write_text(text)

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code && { echo 'No repair needed'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mob020.organize.test.ts
          git commit -m 'test: align MOB-020 FakeDb with SQL contract'
          git push origin HEAD:dev
